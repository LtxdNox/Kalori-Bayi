<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#059669">
<title>Kalori Bayi</title>
<style>
  /* ============ Kalori Keluarga — premium mobile UI ============ */
  :root{
    --bg:#F5F7FA; --card:#FFFFFF; --ink:#1A2233; --muted:#6B7689;
    --line:#E8ECF2; --primary:#10B981; --primary-d:#059669;
    --grad:linear-gradient(135deg,#10B981,#059669);
    --amber:#F59E0B; --rose:#F43F5E; --sky:#0EA5E9; --violet:#8B5CF6;
    --r:18px; --shadow:0 10px 28px rgba(16,24,40,.08);
    --tab-h:68px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior-y:none;
    font-variant-numeric:tabular-nums;
  }
  #app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
  .muted{color:var(--muted)}
  b,strong{font-weight:700}

  /* ---------- header ---------- */
  #topbar{position:sticky;top:0;z-index:20;background:var(--grad);color:#fff;
    border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(5,150,105,.35)}
  .topbar-inner{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px;display:flex;align-items:center}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(4px)}
  .brand-title{font-weight:800;font-size:17px;letter-spacing:.2px}
  .brand-date{font-size:12px;opacity:.9}
  .profile-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 14px;scrollbar-width:none}
  .profile-chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.18);color:#fff;border:1.5px solid transparent;font-size:13.5px;font-weight:600}
  .chip.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.15)}

  /* ---------- views ---------- */
  #views{padding:16px 16px calc(var(--tab-h) + 24px)}
  .view{display:none;animation:fadeUp .25s ease}
  .view.on{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
  .section-head h2{margin:0;font-size:16px;font-weight:800}

  /* ---------- ring card ---------- */
  .ring-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);
    padding:20px 16px;display:flex;align-items:center;gap:18px;margin-bottom:14px;position:relative;overflow:hidden}
  .ring-card::after{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(16,185,129,.14),transparent 70%)}
  .ring-wrap{position:relative;width:132px;height:132px;flex:0 0 auto}
  .ring{width:132px;height:132px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:13;stroke-linecap:round}
  .ring-bg{stroke:var(--line)}
  .ring-fg{stroke:url(#ringGrad);stroke:var(--primary);stroke-dasharray:377;stroke-dashoffset:377;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-pct{font-size:24px;font-weight:800}
  .ring-sub{font-size:11.5px;color:var(--muted)}
  .ring-stats{flex:1;display:flex;flex-direction:column;gap:10px}
  .ring-stat{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .ring-stat:last-child{border:0;padding-bottom:0}
  .rs-label{font-size:13px;color:var(--muted)}
  .rs-val{font-size:19px;font-weight:800}
  .rs-val.good{color:var(--primary-d)} .rs-val.warn{color:var(--amber)}

  /* ---------- forms & btns ---------- */
  .btn-primary{width:100%;border:0;border-radius:14px;padding:14px;background:var(--grad);color:#fff;
    font-size:15.5px;font-weight:800;box-shadow:0 8px 18px rgba(5,150,105,.35)}
  .btn-primary:active{transform:scale(.98)}
  .btn-ghost{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;
    font-size:14px;font-weight:700;color:var(--ink);margin-top:8px}
  .btn-ghost:active{background:var(--line)}

  /* ---------- v2.0: rencana & sesi ---------- */
  .sess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .sess-card{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;
    display:flex;flex-direction:column;gap:4px;align-items:center;min-height:76px;transition:0.2s}
  .sess-card:active{transform:scale(0.95)}
  .sess-card .s-t{font-weight:800;font-size:13px}
  .sess-card .s-v{font-size:11.5px;color:var(--muted);line-height:1.45;text-align:center}
  .sess-card .s-v b{color:var(--ink)}
  .sess-card.done{border-color:var(--primary);background:#ECFDF5}
  .sess-card.done .s-v{color:var(--ink)}

  /* ---------- more ---------- */
  .more-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .more-item{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;border:0;background:#fff;
    font-size:14.5px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);text-align:left}
  .more-item:last-child{border:0}
  .more-item span:first-child{font-size:20px}
  .more-item .chev{margin-left:auto;color:#C3CAD6;font-size:18px}
  .foot-note{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 4px}

  /* ---------- tab bar ---------- */
  #tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:8px 10px env(safe-area-inset-bottom,0px);
    background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;z-index:30;
    border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,24,40,.06)}
  #tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);border-radius:14px}
  #tabbar button span{font-size:21px;transition:0.2s}
  #tabbar button.on{color:var(--primary-d)}
  #tabbar button.on span{transform:scale(1.15)}

  .mood-btn { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 11px; background: #fff; margin-top:4px; font-weight:700}
</style>
</head>
<body>
<div id="app">

  <!-- ======= HEADER ======= -->
  <header id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">👶</div>
        <div>
          <div class="brand-title">Kalori Keluarga</div>
          <div class="brand-date" id="todayLabel">Hari ini</div>
        </div>
      </div>
    </div>
    <div class="profile-chips" id="profileChips">
      <div class="chip on">👧 Zahra</div>
    </div>
  </header>

  <!-- ======= VIEWS ======= -->
  <main id="views">

    <section class="view on" id="view-home">
      <div class="ring-card" id="ringCard">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 140 140">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="70" cy="70" r="60"/>
            <circle class="ring-fg" id="ringFg" cx="70" cy="70" r="60"/>
          </svg>
          <div class="ring-center">
            <div class="ring-pct" id="ringPct">0%</div>
            <div class="ring-sub" id="ringSub">dari target</div>
          </div>
        </div>
        <div class="ring-stats">
          <div class="ring-stat"><span class="rs-label">Masuk</span><span class="rs-val" id="kcalIn">0</span></div>
          <div class="ring-stat" id="targetStat" onclick="editTarget()"><span class="rs-label">Target ✎</span><span class="rs-val" id="kcalTarget">725</span></div>
          <div class="ring-stat"><span class="rs-label">Sisa</span><span class="rs-val warn" id="kcalLeft">725</span></div>
        </div>
      </div>

      <button class="btn-primary" onclick="susunMenu()" style="margin-bottom:12px">🍳 Susun menu masakan hari ini</button>

      <div id="sessArea">
        <div class="section-head"><h2>🍚 Makan Utama (3 Mangkok)</h2><span class="muted" id="sessMealHint" style="font-size:12px; font-weight:bold">0 kkal</span></div>
        <div class="sess-grid" id="sessMeal">
          <!-- Render via JS -->
        </div>

        <div class="section-head"><h2>🍼 Susu SGM Gain 100</h2><span class="muted" id="sessMilkHint" style="font-size:12px; font-weight:bold">0/6 Sesi</span></div>
        <div class="sess-grid" id="sessMilk">
          <!-- Render via JS -->
        </div>
      </div>
    </section>

    <section class="view" id="view-more">
      <div class="more-group">
        <button class="more-item" onclick="resetDay()"><span>🔄</span>Reset Data Hari Ini<span class="chev">›</span></button>
        <button class="more-item" onclick="copyWA()"><span>📋</span>Salin Laporan WA Dokter<span class="chev">›</span></button>
        <button class="more-item" onclick="window.print()"><span>📄</span>Cetak PDF Laporan<span class="chev">›</span></button>
      </div>
      <div class="foot-note">Kalori Keluarga • v2.3.1 Premium Native</div>
    </section>

  </main>

  <!-- ======= TAB BAR ======= -->
  <nav id="tabbar">
    <button data-view="view-home" class="on" onclick="switchTab('view-home', this)"><span>🏠</span>Beranda</button>
    <button data-view="view-more" onclick="switchTab('view-more', this)"><span>☰</span>Lainnya</button>
  </nav>

</div>

<script>
  // State Data Default
  let appData = JSON.parse(localStorage.getItem("kalori_keluarga_premium")) || {
    target: 725,
    menu: { nama: "Sup Daging", kkalPerMl: 1 },
    makan: {
      pagi: { ml: 0, mood: 'biasa' },
      siang: { ml: 0, mood: 'biasa' },
      malam: { ml: 0, mood: 'biasa' }
    },
    susuCount: 0
  };

  const moodEmojis = { lahap: '😋', biasa: '🙂', gtm: '🙈' };

  function saveData() {
    localStorage.setItem("kalori_keluarga_premium", JSON.stringify(appData));
    renderUI();
  }

  function switchTab(viewId, btn) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('on'));
    document.querySelectorAll('#tabbar button').forEach(el => el.classList.remove('on'));
    document.getElementById(viewId).classList.add('on');
    btn.classList.add('on');
  }

  function editTarget() {
    const t = prompt("Masukkan target kalori (kkal):", appData.target);
    if(t) { appData.target = parseInt(t); saveData(); }
  }

  function susunMenu() {
    const nm = prompt("Nama masakan panci hari ini:", appData.menu.nama);
    if(!nm) return;
    const estKkal = prompt("Estimasi total kalori masakan (kkal):", 300);
    const totalMl = prompt("Total dibagi berapa ml untuk 3 mangkok?", 270);
    if(estKkal && totalMl) {
      appData.menu.nama = nm;
      appData.menu.kkalPerMl = parseInt(estKkal) / parseInt(totalMl);
      saveData();
    }
  }

  function inputMakan(sesi) {
    const ml = prompt(`Takaran mangkok ${sesi} (ml):`, appData.makan[sesi].ml);
    if(ml !== null) {
      appData.makan[sesi].ml = parseInt(ml) || 0;
      saveData();
    }
  }

  function ubahMood(sesi, ev) {
    ev.stopPropagation(); // Mencegah klik tombol parent
    const moods = ['lahap', 'biasa', 'gtm'];
    let idx = moods.indexOf(appData.makan[sesi].mood);
    appData.makan[sesi].mood = moods[(idx + 1) % 3];
    saveData();
  }

  function toggleSusu(idx) {
    appData.susuCount = (appData.susuCount === idx) ? idx - 1 : idx;
    saveData();
  }

  function resetDay() {
    if(confirm("Yakin ingin reset data asupan hari ini?")) {
      appData.makan = { pagi: {ml:0, mood:'biasa'}, siang: {ml:0, mood:'biasa'}, malam: {ml:0, mood:'biasa'} };
      appData.susuCount = 0;
      saveData();
    }
  }

  function copyWA() {
    const txt = `📋 Laporan Kalori Zahra
Target: ${appData.target} kkal
- Pagi: ${appData.makan.pagi.ml} ml ${moodEmojis[appData.makan.pagi.mood]}
- Siang: ${appData.makan.siang.ml} ml ${moodEmojis[appData.makan.siang.mood]}
- Malam: ${appData.makan.malam.ml} ml ${moodEmojis[appData.makan.malam.mood]}
- Susu: ${appData.susuCount} sesi (${appData.susuCount * 100} kkal)
Menu Masakan: ${appData.menu.nama}`;
    navigator.clipboard.writeText(txt);
    alert("Berhasil disalin ke clipboard!");
  }

  function renderUI() {
    // 1. Hitung Kalori
    const kkalMakan = (appData.makan.pagi.ml + appData.makan.siang.ml + appData.makan.malam.ml) * appData.menu.kkalPerMl;
    const kkalSusu = appData.susuCount * 100;
    const totalKkal = Math.round(kkalMakan + kkalSusu);
    const sisa = Math.max(0, appData.target - totalKkal);
    const pct = Math.min(100, Math.round((totalKkal / appData.target) * 100));

    // 2. Update Ring & Stats
    document.getElementById('ringPct').innerText = pct + '%';
    document.getElementById('kcalIn').innerText = totalKkal;
    document.getElementById('kcalTarget').innerText = appData.target;
    document.getElementById('kcalLeft').innerText = sisa;
    
    // Perhitungan Dashoffset SVG CSS buatanmu (Keliling = 377)
    const offset = 377 - (377 * pct / 100);
    document.getElementById('ringFg').style.strokeDashoffset = offset;
    document.getElementById('sessMealHint').innerText = `${Math.round(kkalMakan)} kkal`;
    document.getElementById('sessMilkHint').innerText = `${appData.susuCount}/6 Sesi`;

    // 3. Render 3 Mangkok (Premium Cards)
    const sessMeal = document.getElementById('sessMeal');
    sessMeal.innerHTML = ['pagi', 'siang', 'malam'].map(sesi => {
      const data = appData.makan[sesi];
      const isDone = data.ml > 0;
      const kkal = Math.round(data.ml * appData.menu.kkalPerMl);
      return `
        <div class="sess-card ${isDone ? 'done' : ''}" onclick="inputMakan('${sesi}')">
          <div class="s-t" style="text-transform:capitalize">${sesi}</div>
          <div class="s-v"><b>${data.ml} ml</b><br>${kkal} kkal</div>
          <button class="mood-btn" onclick="ubahMood('${sesi}', event)">
            ${moodEmojis[data.mood]} ${data.mood}
          </button>
        </div>`;
    }).join('');

    // 4. Render Susu SGM Grid (Premium Cards)
    const sessMilk = document.getElementById('sessMilk');
    sessMilk.innerHTML = '';
    for(let i=1; i<=6; i++) {
      const isDone = i <= appData.susuCount;
      sessMilk.innerHTML += `
        <div class="sess-card ${isDone ? 'done' : ''}" onclick="toggleSusu(${i})">
          <div class="s-t">Sesi ${i}</div>
          <div class="s-v">5 scoop<br><b>100 kkal</b></div>
        </div>`;
    }

    // Set Tanggal Header
    const tgl = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
    document.getElementById('todayLabel').innerText = tgl;
  }

  // Initial load
  renderUI();
</script>
</body>
</html>
