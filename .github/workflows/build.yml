name: Build Kalori Bayi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rakit APK Android
        run: |
          npm install -g cordova
          cordova create kaloriApp id.wahyu.kaloribayi "Kalori Bayi"
          cd kaloriApp
          cordova platform add android
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          cordova build android --debug

      - name: Simpan APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: Kalori-Bayi-Offline-APK
          path: kaloriApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
