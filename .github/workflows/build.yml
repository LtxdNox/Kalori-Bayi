name: Build Kalori Bayi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rakit APK
        run: |
          npm install -g cordova
          cordova create app id.wahyu.kaloribayi "KaloriBayi"
          cd app
          rm -rf www/*
          cp ../index.html www/
          cordova platform add android
          cordova build android --debug

      - name: Simpan APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: Kalori-Bayi-Offline-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
