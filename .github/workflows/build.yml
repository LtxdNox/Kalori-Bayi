name: Build Kalori Bayi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Isolasi & Rakit APK
        run: |
          mkdir build_source
          cp index.html build_source/
          npx cordova create app id.wahyu.kaloribayi "Kalori Bayi"
          cd app
          rm -rf www/*
          cp ../build_source/index.html www/
          npx cordova platform add android@12.0.0
          npx cordova build android --debug

      - name: Simpan APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: Kalori-Bayi-Offline-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
